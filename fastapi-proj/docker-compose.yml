x-auth-env: &auth-env
  DB_HOST: auth-db
  DB_PORT: 5432
  DB_NAME: ${AUTH_DB_NAME:-auth_db}
  DB_USER: ${AUTH_DB_USER:-postgres}
  DB_PASS: ${AUTH_DB_PASS:?AUTH_DB_PASS is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025

x-org-env: &org-env
  DB_HOST: org-db
  DB_PORT: 5432
  DB_NAME: ${ORG_DB_NAME:-org_db}
  DB_USER: ${ORG_DB_USER:-postgres}
  DB_PASS: ${ORG_DB_PASS:?ORG_DB_PASS is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

x-tasks-env: &tasks-env
  DB_HOST: tasks-db
  DB_PORT: 5432
  DB_NAME: ${TASKS_DB_NAME:-tasks_db}
  DB_USER: ${TASKS_DB_USER:-postgres}
  DB_PASS: ${TASKS_DB_PASS:?TASKS_DB_PASS is required}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

services:
  # ---------- инфраструктура ----------

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:?AUTH_DB_PASS is required}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  org-db:
    image: postgres:16
    container_name: org-db
    environment:
      POSTGRES_DB: ${ORG_DB_NAME:-org_db}
      POSTGRES_USER: ${ORG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORG_DB_PASS:?ORG_DB_PASS is required}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORG_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tasks-db:
    image: postgres:16
    container_name: tasks-db
    environment:
      POSTGRES_DB: ${TASKS_DB_NAME:-tasks_db}
      POSTGRES_USER: ${TASKS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TASKS_DB_PASS:?TASKS_DB_PASS is required}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASKS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # ---------- auth-service ----------

  auth-migrate:
    build: ./auth-service
    container_name: auth-migrate
    environment: *auth-env
    command: alembic upgrade head
    depends_on:
      auth-db:
        condition: service_healthy
    restart: "no"

  auth-api:
    build: ./auth-service
    container_name: auth-api
    environment: *auth-env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  auth-outbox:
    build: ./auth-service
    container_name: auth-outbox
    environment: *auth-env
    command: python -m app.outbox.run_publisher
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  auth-saga:
    build: ./auth-service
    container_name: auth-saga
    environment: *auth-env
    command: python -m app.saga.run_saga
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- org-service ----------

  org-migrate:
    build: ./org-service
    container_name: org-migrate
    environment: *org-env
    command: alembic upgrade head
    depends_on:
      org-db:
        condition: service_healthy
    restart: "no"

  org-api:
    build: ./org-service
    container_name: org-api
    environment: *org-env
    ports:
      - "8002:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      org-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  org-inbox:
    build: ./org-service
    container_name: org-inbox
    environment: *org-env
    command: python -m app.inbox.run_consumer
    depends_on:
      org-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  org-outbox:
    build: ./org-service
    container_name: org-outbox
    environment: *org-env
    command: python -m app.outbox.run_publisher
    depends_on:
      org-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  org-saga:
    build: ./org-service
    container_name: org-saga
    environment: *org-env
    command: python -m app.saga.run_saga_consumer
    depends_on:
      org-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- tasks-service ----------

  tasks-migrate:
    build: ./tasks-service
    container_name: tasks-migrate
    environment: *tasks-env
    command: alembic upgrade head
    depends_on:
      tasks-db:
        condition: service_healthy
    restart: "no"

  tasks-api:
    build: ./tasks-service
    container_name: tasks-api
    environment: *tasks-env
    ports:
      - "8003:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  tasks-inbox:
    build: ./tasks-service
    container_name: tasks-inbox
    environment: *tasks-env
    command: python -m app.inbox.run_consumer
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  tasks-outbox:
    build: ./tasks-service
    container_name: tasks-outbox
    environment: *tasks-env
    command: python -m app.outbox.run_publisher
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  tasks-saga:
    build: ./tasks-service
    container_name: tasks-saga
    environment: *tasks-env
    command: python -m app.saga.run_saga_consumer
    depends_on:
      tasks-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped
  
  auth-watchdog:
    build: ./auth-service
    container_name: auth-watchdog
    environment: *auth-env
    command: python -m app.saga.run_watchdog
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped