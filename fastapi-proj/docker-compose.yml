services:
  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS:-12345}
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  org-db:
    image: postgres:16
    container_name: org-db
    environment:
      POSTGRES_DB: ${ORG_DB_NAME:-org_db}
      POSTGRES_USER: ${ORG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORG_DB_PASS:-12345}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORG_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tasks-db:
    image: postgres:16
    container_name: tasks-db
    environment:
      POSTGRES_DB: ${TASKS_DB_NAME:-tasks_db}
      POSTGRES_USER: ${TASKS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TASKS_DB_PASS:-12345}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASKS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:
  org_db_data:
  tasks_db_data: