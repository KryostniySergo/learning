[project]
name = "tasks-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-utils>=0.42.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "D",     # pydocstyle
    "ASYNC", # flake8-async
]
ignore = [
    "D100", # docstring в модуле не требуем
    "D104", # docstring в пакете не требуем
    "D203", # конфликтует с D211
    "D213", # конфликтует с D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]                 # в тестах docstring необязателен
"alembic/versions/*" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
